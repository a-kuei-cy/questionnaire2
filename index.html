<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教師研習回饋 ‧ 勇者大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#140c2e;--bg2:#24164f;--bg3:#33236b;--gold:#f7c948;--gold2:#c9971c;--parch:#f8ebc8;--parch2:#ead59e;--ink:#3a2715;--red:#e5484d;--green:#3fbf68;--blue:#4c9bff;--purple:#7c4dff}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-family:'Noto Sans TC',system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#3d2585 0%,var(--bg) 62%) fixed;line-height:1.6}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:radial-gradient(2px 2px at 20% 30%,#fff9,transparent),radial-gradient(1px 1px at 70% 20%,#fffa,transparent),radial-gradient(2px 2px at 40% 80%,#fff7,transparent),radial-gradient(1px 1px at 85% 60%,#fffb,transparent),radial-gradient(1.5px 1.5px at 10% 70%,#fff8,transparent),radial-gradient(1px 1px at 55% 45%,#fff9,transparent);background-size:320px 320px;animation:tw 3.5s infinite alternate}
@keyframes tw{to{opacity:.45}}
.pixel{font-family:'DotGothic16','Noto Sans TC',monospace;letter-spacing:.5px}
#app{max-width:860px;margin:0 auto;padding:22px 14px 120px}
.center{text-align:center}
.muted{opacity:.7;font-size:.9em}
.panel{background:var(--bg2);border:4px solid #000;box-shadow:0 0 0 3px var(--gold),6px 6px 0 3px #0009;border-radius:4px;padding:18px 20px;margin:20px 0}
.parch{background:linear-gradient(var(--parch),var(--parch2));color:var(--ink)}
.btn{font-family:'DotGothic16','Noto Sans TC',sans-serif;font-size:17px;cursor:pointer;border:3px solid #000;background:var(--gold);color:#2a1a00;padding:9px 18px;border-radius:4px;box-shadow:inset -3px -3px 0 var(--gold2),3px 3px 0 #000;transition:transform .08s;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px);box-shadow:inset 3px 3px 0 var(--gold2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{font-size:22px;padding:13px 34px}
.btn.sm{font-size:14px;padding:4px 10px;box-shadow:inset -2px -2px 0 #0003,2px 2px 0 #000}
.btn.red{background:var(--red);color:#fff;box-shadow:inset -3px -3px 0 #9b2226,3px 3px 0 #000}
.btn.green{background:var(--green);color:#fff;box-shadow:inset -3px -3px 0 #1f7a3e,3px 3px 0 #000}
.btn.ghost{background:var(--bg3);color:#fff;box-shadow:inset -3px -3px 0 #1c1240,3px 3px 0 #000}
.link{background:none;border:none;color:#c2b3ff;cursor:pointer;text-decoration:underline;font-size:14px}
/* 標題畫面 */
.title-screen{text-align:center;padding-top:18px}
.logo-sub{color:var(--gold);font-size:18px}
.game-title{font-family:'DotGothic16','Noto Sans TC';font-size:clamp(26px,5.4vw,42px);color:var(--gold);text-shadow:3px 3px 0 #000,-1px -1px 0 #000;margin:10px 0 4px;animation:float 3s ease-in-out infinite;line-height:1.35}
.game-sub{font-size:22px;color:#fff;text-shadow:2px 2px 0 #000}
@keyframes float{50%{transform:translateY(-6px)}}
.info{text-align:left;font-size:15px}
.info .row{display:flex;gap:8px}
.info p{margin:10px 0 0}
.choose{margin:26px 0 10px;color:var(--gold);font-size:19px}
.heroes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:560px;margin:0 auto 26px}
.hero{background:var(--bg2);border:3px solid #000;box-shadow:0 0 0 2px #6b5bb0;border-radius:6px;padding:12px 4px;cursor:pointer;color:#fff;font-family:inherit;transition:.15s}
.hero .e{font-size:40px;display:block}
.hero:hover{transform:translateY(-3px)}
.hero.on{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold);background:var(--bg3)}
.hero.on .e{animation:bounce .6s infinite alternate}
@keyframes bounce{to{transform:translateY(-6px)}}
.closed{background:#5a1020;border:3px solid var(--red);padding:10px;border-radius:6px;margin:16px auto;max-width:520px}
/* HUD */
.hud{position:sticky;top:8px;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 16px;margin:0 0 6px}
.hud .av{font-size:38px}
.hud .meta{flex:1;min-width:0}
.hud .nm{font-size:15px}
.exp{height:16px;background:#0007;border:2px solid #000;border-radius:3px;overflow:hidden;margin-top:4px}
.exp i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--green) 0 10px,#5ad884 10px 20px);transition:width .4s}
.lv{background:var(--gold);color:#2a1a00;border:2px solid #000;padding:2px 10px;border-radius:3px;font-size:15px;white-space:nowrap}
.map{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0;margin:16px 0}
.node{width:44px;height:44px;border:3px solid #000;border-radius:50%;display:grid;place-items:center;background:#4a3d78;font-size:20px;filter:grayscale(.7);opacity:.75}
.node.done{background:var(--green);filter:none;opacity:1;color:#fff;font-weight:900}
.node.cur{background:var(--gold);filter:none;opacity:1;box-shadow:0 0 0 3px #fff,0 0 16px var(--gold);animation:pulse 1.2s infinite}
.node.boss{background:#5a1020;font-size:22px}
@keyframes pulse{50%{transform:scale(1.12)}}
.path{width:28px;height:6px;background:#4a3d78;border:2px solid #000;border-left:0;border-right:0}
.path.done{background:var(--green)}
.banner{text-align:center;margin:8px 0 4px}
.banner .st{display:inline-block;background:var(--red);color:#fff;border:3px solid #000;padding:2px 16px;font-size:15px;box-shadow:3px 3px 0 #000}
.banner h2{font-family:'DotGothic16','Noto Sans TC';font-size:28px;margin:10px 0 2px;color:var(--gold);text-shadow:2px 2px 0 #000}
.banner p{margin:0;opacity:.85}
/* 題目 */
.quest{background:linear-gradient(var(--parch),var(--parch2));color:var(--ink);border:4px solid #000;border-radius:4px;box-shadow:5px 5px 0 #0009;padding:16px 18px;margin:18px 0;position:relative}
.quest::before{content:'📜';position:absolute;right:12px;top:8px;font-size:20px;opacity:.5}
.quest.miss{box-shadow:0 0 0 4px var(--red),5px 5px 0 #0009;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qhead{font-weight:700;font-size:17px;padding-right:28px}
.qno{display:inline-block;background:var(--ink);color:var(--gold);font-family:'DotGothic16';font-size:13px;padding:1px 8px;border-radius:3px;margin-right:6px;vertical-align:2px}
.req{color:var(--red);font-size:13px;margin-left:4px}
.qdesc{font-size:14px;opacity:.75;margin-top:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:12px}
.opt{text-align:left;font-family:inherit;font-size:15px;cursor:pointer;background:#fff8e6;color:var(--ink);border:3px solid var(--ink);border-radius:4px;padding:8px 10px 8px 34px;position:relative;transition:.12s}
.opt::before{content:'◇';position:absolute;left:11px;top:7px;color:#a07a3a}
.opt.cb::before{content:'☐'}
.opt:hover{background:#fff;transform:translateX(3px)}
.opt.on{background:var(--purple);color:#fff;border-color:#000;box-shadow:3px 3px 0 #000}
.opt.on::before{content:'◆';color:var(--gold)}
.opt.cb.on::before{content:'☑'}
.scale{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.scale .lb{font-size:13px;font-weight:700;opacity:.8}
.gem{width:46px;height:46px;border:3px solid var(--ink);background:#fff8e6;border-radius:8px;transform:rotate(45deg);cursor:pointer;display:grid;place-items:center;transition:.12s;margin:4px}
.gem span{transform:rotate(-45deg);font-family:'DotGothic16';font-size:18px;color:var(--ink)}
.gem:hover{background:#fff;transform:rotate(45deg) scale(1.08)}
.gem.fill{background:#ffe08a}
.gem.on{background:var(--gold);border-color:#000;box-shadow:0 0 12px #f7c948,3px 3px 0 #000}
.gem.on span{font-weight:900}
.inp{width:100%;font-family:inherit;font-size:15px;padding:9px 11px;border:3px solid var(--ink);border-radius:4px;background:#fffdf5;color:var(--ink);margin-top:10px}
textarea.inp{min-height:90px;resize:vertical}
.inp:focus{outline:none;box-shadow:0 0 0 3px var(--gold)}
.navbar{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
/* 戰鬥 / 勝利 */
.battle{text-align:center;padding:60px 10px}
.battle .boss{font-size:90px;animation:shake .35s infinite}
.battle .slash{font-size:50px;animation:bounce .3s infinite alternate}
.victory{text-align:center}
.trophy{font-size:96px;animation:float 2s infinite}
.badge{display:inline-block;background:linear-gradient(var(--gold),#e6a817);color:#2a1a00;border:4px solid #000;border-radius:999px;padding:8px 22px;font-size:20px;box-shadow:4px 4px 0 #000;margin:12px 0}
.spark{position:fixed;top:-30px;font-size:24px;pointer-events:none;animation:fall linear forwards;z-index:50}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
/* 管理 */
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.admin-head h2{color:var(--gold);margin:0;text-shadow:2px 2px 0 #000}
.tabs{display:flex;gap:8px;margin-top:16px}
.tab{flex:1;font-family:'DotGothic16','Noto Sans TC';font-size:17px;padding:10px;border:3px solid #000;background:var(--bg3);color:#fff;cursor:pointer;border-radius:4px 4px 0 0}
.tab.on{background:var(--gold);color:#2a1a00}
.panel label{display:block;font-size:14px;margin-top:10px;color:#e6dcff}
.panel .inp{margin-top:4px;background:#fffdf5}
.panel label.chk{display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer}
.panel label.chk input{width:18px;height:18px}
.ed-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ed-bar .sp{flex:1}
.ed-sec>.ed-bar b{color:var(--gold);font-size:19px}
.ed-q{background:#1a1040;border:3px solid #000;border-radius:4px;padding:12px 14px;margin:14px 0}
.tag{background:var(--purple);color:#fff;font-size:12px;padding:1px 8px;border-radius:3px;border:2px solid #000}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 2fr 2fr;gap:10px}
.icon-g{display:grid;grid-template-columns:90px 1fr;gap:10px}
.savebar{position:sticky;bottom:10px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bg2);border:4px solid #000;box-shadow:0 0 0 3px var(--gold);padding:10px 14px;border-radius:4px;margin-top:20px}
.savebar .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:#1a1040;border:3px solid #000;border-radius:4px;padding:12px;text-align:center}
.kpi b{display:block;font-family:'DotGothic16';font-size:34px;color:var(--gold)}
.stat .qhead{color:#fff;padding:0}
.bar-row{display:grid;grid-template-columns:minmax(110px,32%) 1fr 92px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar{height:22px;background:#0006;border:2px solid #000;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));transition:width .6s}
.bar.gold i{background:linear-gradient(90deg,#e6a817,var(--gold))}
.bv{text-align:right;font-variant-numeric:tabular-nums;opacity:.9}
.avg{font-size:15px;margin:8px 0}
.avg b{font-family:'DotGothic16';font-size:32px;color:var(--gold);margin-right:4px}
.texts{margin:10px 0 0;padding:0;list-style:none;max-height:320px;overflow:auto}
.texts li{background:#1a1040;border-left:4px solid var(--gold);padding:7px 10px;margin:6px 0;border-radius:2px;font-size:14px;white-space:pre-wrap}
details{margin-top:8px;font-size:14px}
summary{cursor:pointer;color:var(--gold)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#000;color:#fff;border:3px solid var(--gold);padding:10px 20px;border-radius:4px;font-size:15px;z-index:99;transition:.3s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.heroes{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.bar-row{grid-template-columns:1fr 70px}.bar-row .bar{grid-column:1/-1;grid-row:2}.node{width:36px;height:36px;font-size:16px}.path{width:14px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ======================================================
   設定：部署 Google Apps Script 後，把網址貼在這裡
   留空 = 本機示範模式（資料存在瀏覽器，管理密碼 admin）
   ====================================================== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyiUEVRUzpQmAEn2ioNvxDiZUMh3msNE-34NSFk6QtkLXJbAgN-viT1q38MqX4wdBoQVQ/exec';
const LOCAL_PW = 'admin';

const OTHER = '其他';
const HEROES = [{e:'🧙',n:'智慧法師'},{e:'🛡️',n:'守護騎士'},{e:'🏹',n:'遊俠弓手'},{e:'🧚',n:'療癒精靈'}];
const TYPES = {radio:'單選',checkbox:'複選',scale:'線性量表',text:'簡答',textarea:'詳答'};
const AGREE = {max:5,minLabel:'非常不同意',maxLabel:'非常同意'};

const DEFAULT_CONFIG = {
  title:'興嘉國小115學年度教師研習回饋表',
  subtitle:'正向管教知能',
  info:'研習主題：正向管教知能\n研習日期：115年11月11日\n研習講師：陳素萍校長',
  intro:'感謝您參與本次教師研習！請依照實際參與經驗填寫回饋，作為學校未來規劃教師專業成長及校本課程之參考。預估填答時間：3～5分鐘。',
  isOpen:true,
  sections:[
    {id:'s1',icon:'🏰',title:'基本資料',desc:'請填寫基本資料，以利研習成果統計。',questions:[
      {id:'q1',type:'radio',title:'任教年段或職務',required:true,options:['低年級','中年級','高年級','科任教師','行政人員'],other:true}
    ]},
    {id:'s2',icon:'🌲',title:'研習滿意度',desc:'請依您的同意程度給分（1 = 非常不同意，5 = 非常同意）。',questions:[
      {id:'q2',type:'scale',title:'研習內容有助於正向管教知能增進。',required:true,...AGREE},
      {id:'q3',type:'scale',title:'研習對於我的班級經營有所助益。',required:true,...AGREE},
      {id:'q4',type:'scale',title:'講師講解清楚，實例豐富。',required:true,...AGREE},
      {id:'q5',type:'scale',title:'研習時間與流程安排適當。',required:true,...AGREE},
      {id:'q6',type:'scale',title:'整體而言，我對本次研習感到滿意。',required:true,...AGREE}
    ]},
    {id:'s3',icon:'⛰️',title:'學習收穫與課程應用',desc:'請分享本次研習帶給您的啟發，以及未來可能的教學應用。',questions:[
      {id:'q7',type:'checkbox',title:'本次研習中，讓您最有收穫的內容是什麼？',required:true,options:['正向管教的理念與相關法規','班級常規建立與師生約定','正向語言與鼓勵技巧','學生偏差行為的處理與輔導策略','親師溝通與合作','社會情緒學習（SEL）的應用'],other:true},
      {id:'q8',type:'checkbox',title:'研習後，您最想將哪些內容融入教學？',required:true,options:['班級經營與常規訓練','品德教育／生活教育','綜合活動或彈性學習課程','個別學生輔導','親師溝通'],other:true},
      {id:'q9',type:'textarea',title:'您目前在班級經營中，最想解決的管教難題是什麼？',desc:'可描述情境，作為後續研習或社群規劃參考。',required:false}
    ]},
    {id:'s4',icon:'🌋',title:'建議與期待',desc:'您的寶貴意見，是學校前進的力量！',questions:[
      {id:'q10',type:'checkbox',title:'未來您希望參加哪些主題的研習？',required:false,options:['校園生態與環境教育','AI 與數位工具融入教學','跨領域主題式課程設計','特殊需求學生輔導','SEL 社會情緒學習'],other:true},
      {id:'q11',type:'textarea',title:'對本次研習或未來教師增能活動，有什麼建議？',desc:'歡迎提供寶貴意見。',required:false}
    ]}
  ]
};

/* ---------- 狀態 ---------- */
let config = null, answers = {}, others = {}, stage = 0, hero = null, view = 'loading';
const admin = {pw:null, tab:'edit', draft:null, rows:null, loading:false};

/* ---------- 工具 ---------- */
const $app = document.getElementById('app');
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g,'<br>');
const uid = () => 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const optsOf = q => [...(q.options||[]), ...(q.other ? [OTHER] : [])];
const allQs = (cfg = config) => cfg.sections.flatMap(s => s.questions);
const findQ = id => allQs().find(q => q.id === id);
function store(k, v){ try{ if(v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600); }
let actx;
function sfx(f = 660, d = .08, type = 'square'){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f; g.gain.value = .04; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d); o.stop(actx.currentTime + d); }catch(e){} }
function fanfare(){ [523,659,784,1047].forEach((f,i) => setTimeout(() => sfx(f,.18), i*130)); }
function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

/* ---------- API ---------- */
async function apiGet(action){
  if(!GAS_URL) return mock(action, {});
  const r = await fetch(GAS_URL + '?action=' + action);
  return r.json();
}
async function apiPost(action, data){
  if(!GAS_URL) return mock(action, data);
  const r = await fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, ...data})});
  return r.json();
}
function mock(action, d){
  switch(action){
    case 'getConfig': return {ok:true, config:store('fb_config')};
    case 'submit': { const rows = store('fb_rows') || []; rows.push({t:new Date().toISOString(), a:d.answers}); store('fb_rows', rows); return {ok:true}; }
    case 'login': return d.pw === LOCAL_PW ? {ok:true} : {ok:false, msg:'密碼錯誤'};
    case 'saveConfig': if(d.pw !== LOCAL_PW) return {ok:false, msg:'密碼錯誤'}; store('fb_config', d.config); return {ok:true};
    case 'getStats': if(d.pw !== LOCAL_PW) return {ok:false, msg:'密碼錯誤'}; return {ok:true, rows:store('fb_rows') || []};
  }
  return {ok:false, msg:'未知動作'};
}

/* ---------- 畫面 ---------- */
function render(){
  const f = {loading:vLoading, title:vTitle, game:vGame, submitting:vBattle, victory:vVictory, login:vLogin, admin:vAdmin}[view];
  $app.innerHTML = f();
}
function vLoading(){ return `<div class="battle pixel"><div class="trophy">🗺️</div><p>正在展開冒險地圖…</p></div>`; }

function vTitle(){
  const info = String(config.info||'').split('\n').filter(Boolean).map(l => `<div class="row">🔸 ${esc(l)}</div>`).join('');
  return `<div class="title-screen">
    <div class="logo-sub pixel">⚔️ 教師研習回饋大冒險 ⚔️</div>
    <h1 class="game-title">${esc(config.title)}</h1>

function vQuest(q, no){
  const v = answers[q.id];
  let body = '';
  if(q.type === 'radio' || q.type === 'checkbox'){
    const cb = q.type === 'checkbox';
    body = `<div class="opts">${optsOf(q).map((o,i) => {
      const on = cb ? (Array.isArray(v) && v.includes(o)) : v === o;
      return `<button class="opt ${cb?'cb':''} ${on?'on':''}" data-act="${cb?'toggle':'pick'}" data-q="${q.id}" data-i="${i}">${esc(o)}</button>`;
    }).join('')}</div>`;
    const otherOn = q.other && (cb ? (Array.isArray(v) && v.includes(OTHER)) : v === OTHER);
    if(otherOn) body += `<input class="inp" data-ans="other" data-q="${q.id}" placeholder="請填寫其他內容…" value="${esc(others[q.id]||'')}">`;
  } else if(q.type === 'scale'){
    const mx = q.max || 5;
    body = `<div class="scale"><span class="lb">${esc(q.minLabel||'')}</span>${Array.from({length:mx}, (_,i) => i+1).map(k => `<div class="gem ${v===k?'on':(typeof v==='number'&&k<v?'fill':'')}" data-act="scale" data-q="${q.id}" data-v="${k}"><span>${k}</span></div>`).join('')}<span class="lb">${esc(q.maxLabel||'')}</span></div>`;
  } else if(q.type === 'text'){
    body = `<input class="inp" data-ans="text" data-q="${q.id}" placeholder="在此輸入答案…" value="${esc(v||'')}">`;
  } else {
    body = `<textarea class="inp" data-ans="text" data-q="${q.id}" placeholder="在此輸入答案…">${esc(v||'')}</textarea>`;
  }
  return `<div class="quest" id="Q_${q.id}">
    <div class="qhead"><span class="qno">任務 ${no}</span>${esc(q.title)}${q.required ? '<span class="req">★必填</span>' : ''}${q.type==='checkbox' ? ' <span class="muted" style="font-weight:400">（可複選）</span>' : ''}</div>
    ${q.desc ? `<div class="qdesc">${esc(q.desc)}</div>` : ''}
    ${body}
  </div>`;
}

    ${ch ? `<label>選項（每行一個）<textarea class="inp" data-ed="${p}options" rows="4">${esc((q.options||[]).join('\n'))}</textarea></label>
      <label class="chk"><input type="checkbox" data-ed="${p}other" ${q.other?'checked':''}> 加入「其他」自填選項</label>` : ''}
    ${q.type === 'scale' ? `<div class="grid3"><label>最高分<input class="inp" type="number" min="2" max="10" data-ed="${p}max" value="${q.max||5}"></label><label>最低分標籤<input class="inp" data-ed="${p}minLabel" value="${esc(q.minLabel||'')}"></label><label>最高分標籤<input class="inp" data-ed="${p}maxLabel" value="${esc(q.maxLabel||'')}"></label></div>` : ''}

function setEd(path, el){
  const p = path.split('.'); let obj, key;
  if(p[0] === 's'){ const s = admin.draft.sections[+p[1]]; if(p[2] === 'q'){ obj = s.questions[+p[3]]; key = p[4]; } else { obj = s; key = p[2]; } }
  else { obj = admin.draft; key = p[0]; }
  let val = el.type === 'checkbox' ? el.checked : el.value;
  if(key === 'options') val = el.value.split('\n').map(x => x.trim()).filter(Boolean);
  if(key === 'max') val = Math.max(2, Math.min(10, parseInt(el.value) || 5));
  obj[key] = val;
  if(key === 'type'){
    if((val === 'radio' || val === 'checkbox') && !(obj.options||[]).length) obj.options = ['選項1','選項2'];
    if(val === 'scale'){ obj.max = obj.max || 5; obj.minLabel = obj.minLabel || '非常不同意'; obj.maxLabel = obj.maxLabel || '非常同意'; }
    render();
  }
}

function edOp(d){
  const S = admin.draft.sections, si = +d.s, qi = +d.q;
  const mv = (arr,i,j) => { if(j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
  switch(d.op){
    case 'addSec': S.push({id:'s'+uid(), icon:'⭐', title:'新關卡', desc:'', questions:[]}); break;
    case 'delSec': if(!confirm(`確定刪除「${S[si].title}」整個關卡？`)) return; S.splice(si,1); break;
    case 'upSec': mv(S, si, si-1); break;
    case 'downSec': mv(S, si, si+1); break;
    case 'addQ': S[si].questions.push({id:uid(), type:'radio', title:'新題目', required:false, options:['選項1','選項2'], other:false}); break;
    case 'dupQ': { const c = clone(S[si].questions[qi]); c.id = uid(); c.title += '（複本）'; S[si].questions.splice(qi+1, 0, c); } break;
    case 'delQ': if(!confirm('確定刪除此題？（已收集的資料仍保留在試算表中）')) return; S[si].questions.splice(qi,1); break;
    case 'upQ': mv(S[si].questions, qi, qi-1); break;
    case 'downQ': mv(S[si].questions, qi, qi+1); break;
  }
  render();
}

function vStats(){
  if(admin.loading || !admin.rows) return `<div class="panel center pixel">📜 正在讀取冒險紀錄…</div>`;
  const rows = admin.rows, qs = allQs();
  const lastT = rows.length ? new Date(rows[rows.length-1].t).toLocaleString('zh-TW') : '—';
  const scaleQs = qs.filter(q => q.type === 'scale');
  const scaleAvgs = scaleQs.map(q => { const nums = rows.map(r => Number(r.a && r.a[q.id])).filter(x => x > 0); return {q, avg: nums.length ? nums.reduce((a,b) => a+b, 0)/nums.length : 0, n: nums.length}; });
  const overall = scaleAvgs.filter(x => x.n).length ? scaleAvgs.filter(x => x.n).reduce((a,x) => a + x.avg/(x.q.max||5)*5, 0) / scaleAvgs.filter(x => x.n).length : 0;
  let html = `<div class="panel">
    <div class="kpis">
      <div class="kpi"><b>${rows.length}</b>回應份數</div>
      <div class="kpi"><b>${overall ? overall.toFixed(2) : '—'}</b>量表平均（滿分5）</div>
      <div class="kpi"><b style="font-size:17px;line-height:2.4">${esc(lastT)}</b>最近一筆</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn sm" data-act="reloadStats">🔄 重新整理</button><button class="btn ghost sm" data-act="csv" ${rows.length?'':'disabled'}>⬇ 下載 CSV</button></div>
  </div>`;
  if(!rows.length) return html + `<div class="panel center">🕸️ 目前還沒有勇者完成冒險</div>`;
  if(scaleAvgs.length){
    html += `<div class="panel"><h3 class="pixel" style="margin:0 0 6px;color:var(--gold)">⭐ 滿意度總覽</h3>
      ${scaleAvgs.map(x => `<div class="bar-row"><span>${esc(x.q.title)}</span><div class="bar gold"><i style="width:${x.avg/(x.q.max||5)*100}%"></i></div><span class="bv">${x.avg.toFixed(2)} / ${x.q.max||5}</span></div>`).join('')}</div>`;
  }
  let n = 0;
  html += qs.map(q => statCard(q, ++n, rows)).join('');
  return html;
}

function barRow(label, c, N){
  const pct = N ? c/N*100 : 0;
  return `<div class="bar-row"><span>${esc(label)}</span><div class="bar"><i style="width:${pct}%"></i></div><span class="bv">${c} 人・${pct.toFixed(0)}%</span></div>`;
}

function statCard(q, no, rows){
  const vals = rows.map(r => r.a && r.a[q.id]).filter(v => v != null && v !== '' && !(Array.isArray(v) && !v.length));
  const N = vals.length;
  let body = '';
  if(q.type === 'radio' || q.type === 'checkbox'){
    const cnt = {}; optsOf(q).forEach(o => cnt[o] = 0); const oth = [];
    vals.forEach(v => (Array.isArray(v) ? v : [v]).forEach(x => {
      x = String(x);
      if(x.startsWith(OTHER + '：')){ cnt[OTHER] = (cnt[OTHER]||0) + 1; oth.push(x.slice(OTHER.length + 1)); }
      else cnt[x] = (cnt[x]||0) + 1;
    }));
    body = Object.entries(cnt).sort((a,b) => q.type==='checkbox' ? b[1]-a[1] : 0).map(([k,c]) => barRow(k, c, N)).join('');
    if(oth.length) body += `<details><summary>查看「其他」自填內容（${oth.length}）</summary><ul class="texts">${oth.map(o => `<li>${esc(o)}</li>`).join('')}</ul></details>`;
  } else if(q.type === 'scale'){
    const mx = q.max || 5, nums = vals.map(Number).filter(x => x > 0);
    const avg = nums.length ? nums.reduce((a,b) => a+b, 0)/nums.length : 0;
    body = `<div class="avg"><b>${avg.toFixed(2)}</b>/ ${mx}　${'★'.repeat(Math.round(avg/mx*5))}${'☆'.repeat(5-Math.round(avg/mx*5))}</div>`;
    for(let k = mx; k >= 1; k--) body += barRow(`${k} 分${k===mx&&q.maxLabel?'（'+q.maxLabel+'）':''}${k===1&&q.minLabel?'（'+q.minLabel+'）':''}`, nums.filter(x => x === k).length, nums.length);
  } else {
    body = N ? `<ul class="texts">${vals.map(v => `<li>${esc(v)}</li>`).join('')}</ul>` : '<p class="muted">尚無填答</p>';
  }
  return `<div class="panel stat"><div class="qhead"><span class="qno">任務 ${no}</span>${esc(q.title)} <span class="tag">${TYPES[q.type]}</span> <span class="muted" style="font-weight:400">・回答 ${N} 人</span></div>${body}</div>`;
}

function exportCsv(){
  const qs = allQs(), rows = admin.rows || [];
  const lines = [['時間戳記', ...qs.map(q => q.title)], ...rows.map(r => [new Date(r.t).toLocaleString('zh-TW'), ...qs.map(q => { const v = r.a && r.a[q.id]; return Array.isArray(v) ? v.join('、') : (v ?? ''); })])];
  const s = '﻿' + lines.map(l => l.map(x => '"' + String(x).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  download(`${config.title}_回饋統計.csv`, s, 'text/csv;charset=utf-8');
}

/* ---------- 填答邏輯 ---------- */
function isAnswered(q){
  const v = answers[q.id];
  if(q.type === 'checkbox') return Array.isArray(v) && v.length > 0;
  if(q.type === 'scale') return typeof v === 'number';
  return v != null && String(v).trim() !== '';
}
function checkStage(){
  const miss = config.sections[stage].questions.filter(q => q.required && !isAnswered(q));
  if(!miss.length) return true;
  miss.forEach(q => { const el = document.getElementById('Q_' + q.id); if(el){ el.classList.remove('miss'); void el.offsetWidth; el.classList.add('miss'); } });
  const first = document.getElementById('Q_' + miss[0].id); if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
  toast(`⚠️ 還有 ${miss.length} 個必填任務未完成！`); sfx(160, .25, 'sawtooth');
  return false;
}
async function submitAll(){
  const out = {};
  allQs().forEach(q => {
    let v = answers[q.id]; if(v == null) return;
    const o = (others[q.id] || '').trim();
    if(q.type === 'radio' && v === OTHER && o) v = OTHER + '：' + o;
    if(q.type === 'checkbox') v = v.map(x => x === OTHER && o ? OTHER + '：' + o : x);
    if(typeof v === 'string') v = v.trim();
    out[q.id] = v;
  });
  const meta = allQs().map(q => ({id:q.id, title:q.title}));
  view = 'submitting'; render(); window.scrollTo(0,0);
  try{
    const [r] = await Promise.all([apiPost('submit', {answers:out, meta}), sleep(1400)]);
    if(!r.ok) throw new Error(r.msg || '送出失敗');
    view = 'victory'; render(); fanfare(); sparkle();
  }catch(e){ view = 'game'; render(); toast('❌ ' + e.message + '，請再試一次'); }
}
function sparkle(){
  const icons = ['⭐','✨','🪙','💎','🎉'];
  for(let i = 0; i < 36; i++){
    const s = document.createElement('div'); s.className = 'spark'; s.textContent = icons[i % icons.length];
    s.style.left = Math.random()*100 + 'vw'; s.style.animationDuration = (2 + Math.random()*2.5) + 's'; s.style.animationDelay = Math.random()*1.2 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 6000);
  }
}
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }

/* ---------- 事件 ---------- */
const actions = {
  hero: (el,d) => { hero = +d.i; sfx(880); render(); },
  start: () => {
    if(hero == null){ toast('🧭 請先選擇一位勇者！'); return; }
    answers = {}; others = {}; stage = 0; view = 'game'; sfx(523); render(); window.scrollTo(0,0);
  },
  pick: (el,d) => { const q = findQ(d.q); answers[q.id] = optsOf(q)[+d.i]; sfx(740,.05); keepScroll(render); },
  toggle: (el,d) => {
    const q = findQ(d.q), o = optsOf(q)[+d.i], cur = new Set(answers[q.id] || []);
    cur.has(o) ? cur.delete(o) : cur.add(o);
    answers[q.id] = optsOf(q).filter(x => cur.has(x)); sfx(740,.05); keepScroll(render);
  },
  scale: (el,d) => { answers[d.q] = +d.v; sfx(400 + (+d.v)*90, .07); keepScroll(render); },
  next: () => { if(!checkStage()) return; stage++; [523,784].forEach((f,i) => setTimeout(() => sfx(f,.12), i*110)); render(); window.scrollTo(0,0); toast(`🎉 關卡完成！升級為 Lv.${stage+1}`); },
  prev: () => { stage--; render(); window.scrollTo(0,0); },
  submit: () => { if(checkStage()) submitAll(); },
  home: () => { document.querySelectorAll('.spark').forEach(s => s.remove()); view = 'title'; answers = {}; others = {}; stage = 0; render(); window.scrollTo(0,0); },
  goLogin: () => { view = 'login'; render(); setTimeout(() => document.getElementById('pw')?.focus(), 50); },
  login: async (el) => {
    const pw = document.getElementById('pw').value; if(!pw) return toast('請輸入密碼');
    el.disabled = true;
    try{
      const r = await apiPost('login', {pw});
      if(!r.ok) throw new Error(r.msg || '密碼錯誤');
      admin.pw = pw; admin.draft = clone(config); admin.tab = 'edit'; admin.rows = null; view = 'admin'; fanfare(); render();
    }catch(e){ toast('❌ ' + e.message); el.disabled = false; sfx(160,.25,'sawtooth'); }
  },
  logout: () => { admin.pw = null; view = 'title'; render(); },
  tab: (el,d) => { admin.tab = d.t; if(d.t === 'stats' && !admin.rows) loadStats(); else render(); },
  ed: (el,d) => edOp(d),
  save: (el) => saveConfig(el),
  exportJson: () => download('問卷設定.json', JSON.stringify(admin.draft, null, 2), 'application/json'),
  resetDefault: () => { if(!confirm('確定還原為預設問卷？（需按「儲存並發布」才會生效）')) return; admin.draft = clone(DEFAULT_CONFIG); render(); },
  reloadStats: () => loadStats(),
  csv: () => exportCsv()
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = actions[el.dataset.act]; if(fn) fn(el, el.dataset, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.ans === 'text') answers[el.dataset.q] = el.value;
  else if(el.dataset.ans === 'other') others[el.dataset.q] = el.value;
  else if(el.dataset.ed) setEd(el.dataset.ed, el);
});
document.addEventListener('change', e => {
  if(e.target.id !== 'importFile' || !e.target.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const obj = JSON.parse(fr.result);
      if(!obj || !Array.isArray(obj.sections)) throw new Error();
      admin.draft = obj; render(); toast('📥 已匯入，記得按「儲存並發布」');
    }catch(err){ toast('❌ JSON 格式不正確'); }
  };
  fr.readAsText(e.target.files[0]);
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.id === 'pw') document.querySelector('[data-act="login"]')?.click(); });

/* ---------- 啟動 ---------- */
(async function init(){
  render();
  try{
    const r = await apiGet('getConfig');
    config = (r && r.ok && r.config) ? r.config : clone(DEFAULT_CONFIG);
  }catch(e){
    config = clone(DEFAULT_CONFIG); toast('⚠️ 無法連線伺服器，顯示預設問卷');
  }
  view = 'title'; render();
})();
</script>
</body>
</html>
